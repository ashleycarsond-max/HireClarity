# Pipeline cron — full-description-coverage sweep (2×/hour).
#
# WHY THIS EXISTS: Vercel Hobby rejects sub-daily cron schedules at deploy time
# (HTTP 400), so this job moved off Vercel Cron to a GitHub Actions schedule
# that calls the same endpoint with the same fail-closed
# `Authorization: Bearer <CRON_SECRET>` header. Only /api/cron/daily (02:30)
# and /api/cron/report (09:00) remain Vercel crons — never add sub-daily
# schedules back to vercel.json / build-vercel.sh.
#
# SCHEDULE: `5,35 * * * *` (UTC) — offset from the sync job's :00/:15/:30/:45
# slots so the two pipelines never hit a host at the same instant. Each run is a
# bounded rolling sweep (never-read → stale 7d → oldest-covered rotation, per-host
# cap, wall-clock budget) reading every tracked posting's description on a
# rolling cycle.
#
# SETUP: repository Actions secret CRON_SECRET (same value as the Vercel project
# env var). Set with:
#   gh secret set CRON_SECRET --repo ashleycarsond-max/HireClarity

name: pipeline-requirements

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

concurrency:
  group: pipeline-requirements
  cancel-in-progress: false

jobs:
  requirements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/requirements
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          url="https://hireclarity-data.vercel.app/api/cron/requirements"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Actions secret CRON_SECRET is not set — the scheduled pipeline cannot authenticate. Set it with: gh secret set CRON_SECRET"
            exit 1
          fi
          body="$(mktemp)"
          code="$(curl -sS --max-time 90 -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "user-agent: hireclarity-pipeline-cron (github actions)" \
            "$url")" || {
              echo "::error::curl failed for $url (network error or no response within 90s)"
              exit 1
            }
          echo "GET ${url} -> HTTP ${code}"
          echo "response body (first 2000 bytes):"
          head -c 2000 "$body"; echo
          if [ "$code" != "200" ]; then
            echo "::error::$url returned HTTP ${code} — the description sweep did not run"
            exit 1
          fi
